name: Publish Helm Chart to GHCR

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version without v prefix (e.g. 0.3.0-rc1)'
        required: true
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/helm-chart-ghcr-release.yaml'

permissions:
  contents: read
  packages: write

env:
  CHART_PATH: charts

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    container:
      image: alpine/helm:3.19.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: apk add --no-cache yq bash

      - name: Lint chart
        run: helm lint "${CHART_PATH}" --strict

      - name: Validate chart templates
        run: helm template test "${CHART_PATH}" > /dev/null

  publish-ghcr:
    runs-on: ubuntu-latest
    container:
      image: alpine/helm:3.19.0
    needs: lint-and-validate
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: apk add --no-cache yq bash

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(yq eval '.version' "${CHART_PATH}/Chart.yaml")
          fi
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Patch chart for fork registry
        run: |
          set -euo pipefail
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          DRIVER_IMAGE="ghcr.io/${REPO_LC}"
          OPERATOR_IMAGE="ghcr.io/${REPO_LC}-volume-recovery-operator"
          yq -i ".version = \"${{ steps.version.outputs.version }}\"" "${CHART_PATH}/Chart.yaml"
          yq -i ".appVersion = \"${{ steps.version.outputs.app_version }}\"" "${CHART_PATH}/Chart.yaml"
          yq -i ".image.rclone.repository = \"${DRIVER_IMAGE}\"" "${CHART_PATH}/values.yaml"
          yq -i ".volumeRecoveryOperator.image.repository = \"${OPERATOR_IMAGE}\"" "${CHART_PATH}/values.yaml"
          yq -i ".home = \"https://github.com/${{ github.repository }}\"" "${CHART_PATH}/Chart.yaml"
          yq -i ".sources[0] = \"https://github.com/${{ github.repository }}\"" "${CHART_PATH}/Chart.yaml"

      - name: Push Helm chart to GHCR
        id: push
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: csi-driver-rclone
          repository: ${{ steps.version.outputs.owner_lc }}/charts
          tag: ${{ steps.version.outputs.version }}
          app_version: ${{ steps.version.outputs.app_version }}
          path: ${{ env.CHART_PATH }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          update_dependencies: 'true'

      - name: Summary
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Helm chart published

          **Chart:** \`oci://ghcr.io/${{ steps.version.outputs.owner_lc }}/charts/csi-driver-rclone\`
          **Version:** \`${{ steps.version.outputs.version }}\`

          \`\`\`bash
          helm upgrade --install csi-rclone oci://ghcr.io/${{ steps.version.outputs.owner_lc }}/charts/csi-driver-rclone \\
            --version ${{ steps.version.outputs.version }} \\
            --namespace veloxpack --create-namespace \\
            -f hack/e2e/helm-values-fork-ghcr.yaml
          \`\`\`

          Images default to this fork:
          - \`ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}\`
          - \`ghcr.io/${{ github.repository }}-volume-recovery-operator:v${{ steps.version.outputs.version }}\`
          EOF
