# Install from fork GHCR chart; images patched at publish time to ghcr.io/<owner>/fork-csi-driver-rclone.
node:
  remount:
    enabled: true
  staging:
    enabled: true
  hostPID: true

volumeRecoveryOperator:
  enabled: true

storageClass:
  create: true
  name: rclone-e2e
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  mountOptions:
    - allow-other
    - vfs-cache-mode=writes
    - vfs-cache-max-size=256M
  parameters:
    remote: minio
    remotePath: fork-test-bucket
    configData: |
      [minio]
      type = s3
      provider = Minio
      endpoint = http://minio.csi-rclone-e2e.svc.cluster.local:9000
      access_key_id = minioadmin
      secret_access_key = minioadmin
