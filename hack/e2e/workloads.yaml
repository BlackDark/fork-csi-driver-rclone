apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e2e-data
  namespace: csi-rclone-e2e
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rclone-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-writer
  namespace: csi-rclone-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-writer
  template:
    metadata:
      labels:
        app: e2e-writer
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do date >> /data/e2e.log; sleep 5; done"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: e2e-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-writer-propagated
  namespace: csi-rclone-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-writer-propagated
  template:
    metadata:
      labels:
        app: e2e-writer-propagated
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do date >> /data/e2e.log; sleep 5; done"]
          volumeMounts:
            - name: data
              mountPath: /data
              mountPropagation: HostToContainer
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: e2e-data-prop
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e2e-data-prop
  namespace: csi-rclone-e2e
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rclone-e2e
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e2e-bad-creds
  namespace: csi-rclone-e2e
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rclone-e2e-bad
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rclone-e2e-bad
provisioner: rclone.csi.veloxpack.io
parameters:
  remote: minio
  remotePath: e2e-bucket
  configData: |
    [minio]
    type = s3
    provider = Minio
    endpoint = http://minio.csi-rclone-e2e.svc.cluster.local:9000
    access_key_id = wrong
    secret_access_key = wrong
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - allow-other
  - vfs-cache-mode=writes
  - vfs-cache-max-size=256M
---
apiVersion: v1
kind: Pod
metadata:
  name: e2e-bad-creds-pod
  namespace: csi-rclone-e2e
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: e2e-bad-creds
