---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volume-recovery-operator
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volume-recovery-operator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volume-recovery-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volume-recovery-operator
subjects:
  - kind: ServiceAccount
    name: volume-recovery-operator
    namespace: system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: volume-recovery-operator
  namespace: system
  labels:
    app: volume-recovery-operator
spec:
  selector:
    matchLabels:
      app: volume-recovery-operator
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: volume-recovery-operator
    spec:
      serviceAccountName: volume-recovery-operator
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: operator
          image: ghcr.io/veloxpack/csi-driver-rclone:latest
          command: ["/volume-recovery-operator"]
          args:
            - --kubelet-dir=/var/lib/kubelet
            - --provisioner=rclone.csi.veloxpack.io
            - --scan-interval=60s
            - --csi-restart-recovery=true
            - --csi-node-label=app=csi-rclone-node
            - --csi-restart-ready-timeout=90s
            - --mount-probe-timeout=3s
            - --orphan-lazy-umount=true
            - --orphan-fuse-abort=true
            - --orphan-kill-mount-process=true
            - --v=2
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
              drop: ["ALL"]
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: false
              mountPropagation: "Bidirectional"
            - name: fuse-connections
              mountPath: /sys/fs/fuse
              readOnly: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: fuse-connections
          hostPath:
            path: /sys/fs/fuse
            type: Directory
